framework: "net10.0"
overview: "Detects your GPU and configures hardware transcoding automatically"
description: >
  Probes every GPU / media engine on the server with short real ffmpeg jobs
  (NVENC/NVDEC, Intel QSV, VA-API, AMD AMF, Apple VideoToolbox, Rockchip MPP)
  and writes the working hardware acceleration type, device, hardware decoding
  codecs, 10/12-bit and HEVC RExt decoding, HEVC/AV1 encoding, Intel low-power
  encoders and tone mapping into Jellyfin's transcoding settings.
