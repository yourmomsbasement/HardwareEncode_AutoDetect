name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HWAD_FFMPEG: /usr/bin/ffmpeg
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packaging dependency
        run: python -m pip install PyYAML==6.0.3

      - name: Install ffmpeg (for the real-ffmpeg integration test)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build --logger trx --results-directory artifacts/test-results

      - name: Publish plugin
        run: dotnet publish src/Jellyfin.Plugin.HardwareAutoDetect -c Release --no-restore -o artifacts/plugin

      - name: Package plugin and Jellyfin catalog
        run: python scripts/package_plugin.py --repository "$GITHUB_REPOSITORY"

      - uses: actions/upload-artifact@v4
        with:
          name: Jellyfin.Plugin.HardwareAutoDetect
          if-no-files-found: error
          path: |
            artifacts/plugin/Jellyfin.Plugin.HardwareAutoDetect.dll
            artifacts/repository/*

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results/*.trx
          if-no-files-found: warn
